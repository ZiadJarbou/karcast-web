<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KarCast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Stream Container & Video element -->
    <div id="stream-container">
      <video id="remoteVideo" autoplay playsinline muted></video>
    </div>

    <!-- Unobtrusive Connection Pill (Shown when streaming) -->
    <div id="connection-pill" hidden>
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connected</span>
    </div>

    <!-- Vehicle Pairing Overlay -->
    <div id="pairing-overlay">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="3"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div>
            <div class="eyebrow">KarCast</div>
            <div class="brand-title">Connect Vehicle</div>
          </div>
        </div>

        <!-- Visual Phone Setup Steps -->
        <div id="visual-guide-container" class="guide-steps">
          <div class="guide-step">
            <div class="step-num">1</div>
            <div class="step-content">
              <div class="step-title">Open KarCast App</div>
              <div class="step-desc">Open the KarCast app on your phone.</div>
            </div>
          </div>

          <div class="guide-step">
            <div class="step-num">2</div>
            <div class="step-content">
              <div class="step-title">Tap "Start Connection"</div>
              <div class="step-desc">Tap the green Start connection button on your phone.</div>
            </div>
          </div>
        </div>

        <div id="message-box" class="message-box">Connecting to phone...</div>

        <!-- Progress Loading Component -->
        <div id="progress-container" hidden>
          <div class="progress-header">
            <div id="progress-title" class="progress-title">Connecting to Vehicle...</div>
            <div id="progress-badge" class="progress-badge">25%</div>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 25%;"></div>
          </div>
          <p id="progress-subtitle" class="progress-subtitle">Establishing secure WebRTC connection...</p>
        </div>
      </div>
    </div>

    <!-- Diagnostics Overlay (?metrics=1) -->
    <pre id="metrics-panel" hidden></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
