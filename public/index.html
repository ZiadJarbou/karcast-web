<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KarCast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Stream Container & Video element -->
    <div id="stream-container">
      <video id="remoteVideo" autoplay playsinline muted></video>
    </div>

    <!-- Unobtrusive Connection Pill (Shown when streaming) -->
    <div id="connection-pill" hidden>
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connected</span>
    </div>

    <!-- Vehicle Pairing Overlay -->
    <div id="pairing-overlay">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="3"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div>
            <div class="eyebrow">KarCast</div>
            <div class="brand-title">Connect Vehicle</div>
          </div>
        </div>

        <p class="subtitle">Enter the 6-digit code displayed in the KarCast app on your phone to connect.</p>

        <!-- 6-Digit Code Input Form -->
        <div id="code-form">
          <div class="code-inputs">
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off" autofocus>
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off">
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off">
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off">
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off">
            <input type="text" class="code-digit" inputmode="numeric" maxlength="1" autocomplete="off">
          </div>

          <button id="connect-btn" class="primary-button" disabled>
            <span>Connect</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <button id="retry-btn" class="secondary-button" hidden>Try Again</button>
        </div>

        <div id="message-box" class="message-box"></div>
      </div>
    </div>

    <!-- Diagnostics Overlay (?metrics=1) -->
    <pre id="metrics-panel" hidden></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
